name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Run PyTest
  # ──────────────────────────────────────────────────────────
  test:
    name: Run PyTest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with PyTest
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-results.xml

  # ──────────────────────────────────────────────────────────
  # JOB 2: Build & Push Docker Image
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/faculty-appt-system:latest
            ${{ secrets.DOCKER_USERNAME }}/faculty-appt-system:${{ github.sha }}

  # ──────────────────────────────────────────────────────────
  # JOB 3: Deploy (simulated)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Simulate Deployment
        run: |
          echo "✅ Deploying faculty-appt-system to production..."
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/faculty-appt-system:${{ github.sha }}"
          echo "🚀 Deployment complete!"
